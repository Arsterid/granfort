services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:24-trixie
    command: sleep infinity
    volumes:
      - ..:/workspace:cached
    environment:
      DATABASE_URL: postgresql://granfort:granfort_local@db:5432/granfort?schema=public
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: granfort
      POSTGRES_PASSWORD: granfort_local
      POSTGRES_DB: granfort
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U granfort -d granfort"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
